[project]
name = "adaptive-range-bot"
version = "0.1.0"
description = "Deterministic adaptive-range trading bot core"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alpaca-py>=0.43.5",
  "arch>=8,<9",
  "duckdb>=1.4",
  "numpy>=2.3",
  "optuna>=4.5,<5",
  "pandas>=2.3",
  "pandas-market-calendars>=5.3",
  "pyarrow>=20",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "pyyaml>=6.0",
  "scikit-learn>=1.7,<2",
  "websockets>=15.0",
]

[project.scripts]
adaptive-bot = "adaptive_bot.cli:main"

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x[ctk]>=14.1.1",
    "xgboost>=3.0,<4",
]

[dependency-groups]
dev = [
  "hypothesis>=6.135,<6.150",
  "mypy>=1.16",
  "pandas-stubs>=2.3",
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "ruff>=0.12",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_bot"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["adaptive_bot"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "joblib",
    "arch",
    "arch.*",
    "sklearn",
    "sklearn.*",
    "xgboost",
    "xgboost.*",
    "pandas_market_calendars",
    "pandas_market_calendars.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"
asyncio_mode = "auto"
